<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bloopix Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        background: #111;
        color: #fff;
        font-family: 'Press Start 2P', cursive;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        height: 100vh;
      }
      #game-container {
        max-width: 400px;
        width: 100%;
        aspect-ratio: 5 / 8;
        position: relative;
      }
      canvas {
        width: 100%;
        height: 100%;
      }
      #game-over {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.9);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        display: none;
      }
      #game-over video {
        width: 80%;
        margin-bottom: 16px;
        border: 2px solid white;
        border-radius: 8px;
      }
      #play-again {
        background-color: #00ff99;
        color: #000;
        padding: 10px 20px;
        border: none;
        cursor: pointer;
        font-family: 'Press Start 2P';
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="game"></canvas>
      <div id="game-over">
        <video src="assets/animations/pipa-cat-pipa.mp4" autoplay loop muted></video>
        <p>Game Over!</p>
        <button id="play-again">Play Again</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
    <script>
      let game;
      let jumpSound, hitSound;

      const config = {
        type: Phaser.AUTO,
        width: 500,
        height: 800,
        parent: 'game-container',
        scene: {
          preload,
          create,
          update
        },
        physics: {
          default: 'arcade',
          arcade: {
            gravity: { y: 500 },
            debug: false
          }
        }
      };

      function preload() {
        this.load.image('player', 'assets/player.png');
        this.load.image('obstacle', 'assets/obstacle.png');
        this.load.audio('jump', 'assets/sounds/jump.mp3');
        this.load.audio('hit', 'assets/sounds/hit.mp3');
      }

      let player;
      let obstacles;
      let cursors;
      let gameOver = false;

      function create() {
        jumpSound = this.sound.add('jump');
        hitSound = this.sound.add('hit');

        player = this.physics.add.sprite(100, 450, 'player');
        player.setCollideWorldBounds(true);

        obstacles = this.physics.add.group();
        this.time.addEvent({
          delay: 2000,
          callback: addObstacle,
          callbackScope: this,
          loop: true
        });

        cursors = this.input.keyboard.createCursorKeys();
        this.physics.add.collider(player, obstacles, handleHit, null, this);

        document.getElementById('play-again').onclick = () => {
          location.reload();
        }
      }

      function addObstacle() {
        const obstacle = obstacles.create(600, 750, 'obstacle');
        obstacle.setVelocityX(-100); // Slower speed for easier gameplay
        obstacle.setImmovable(true);
        obstacle.body.allowGravity = false;
      }

      function update() {
        if (gameOver) return;

        if (Phaser.Input.Keyboard.JustDown(cursors.up)) {
          player.setVelocityY(-300);
          jumpSound.play();
        }
      }

      function handleHit(player, obstacle) {
        gameOver = true;
        hitSound.play();
        this.physics.pause();
        document.getElementById('game-over').style.display = 'flex';
      }

      game = new Phaser.Game(config);
    </script>
  </body>
</html>
